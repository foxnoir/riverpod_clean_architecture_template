name: book_dragon
description: "riverpod and clean architecture template app"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.6 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  bloc: ^9.0.0
  flutter_bloc: ^9.0.0
  chewie: ^1.9.0
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  equatable: ^2.0.7
  file_picker: ^8.1.7
  font_awesome_flutter: ^10.8.0
  get_it: ^8.0.3
  iconly: ^1.0.1
  image_picker: ^1.1.2
  shared_preferences: ^2.3.5
  injectable: ^2.5.0
  logger: ^2.5.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4
  go_router: ^14.8.0
  dart_mappable: ^4.4.0
  http: ^1.2.2
  bloc_test: ^10.0.0
  riverpod_lint: ^2.6.3
  riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  smooth_page_indicator: ^1.2.1
  flutter_screenutil: ^5.9.3
  country_picker: ^2.0.27
  flutter_hooks: ^0.21.2
  hooks_riverpod: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mocktail: ^1.0.0
  very_good_analysis: ^7.0.0
  build_runner: ^2.4.13
  injectable_generator: ^2.6.2
  json_serializable: ^6.6.1
  dart_mappable_builder: ^4.3.0
  custom_lint: ^0.7.0
  riverpod_generator: ^2.6.3

flutter_icons:
  ios: true
  image_path: "assets/images/launcher_icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/launcher_icon/app_icon.png"

flutter_native_splash:
  color: "#fefefe"
  image: assets/images/splash.png
  ios: true
  ios_content_mode: scaleToFill

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/app_icons/
    - assets/images/start/
    - assets/images/backgrounds/

  fonts:
    - family: Aeonik
      fonts:
        - asset: assets/fonts/aeonik/AeonikTRIAL-Bold.otf
          weight: 700
        - asset: assets/fonts/aeonik/AeonikTRIAL-BoldItalic.otf
          style: italic
          weight: 700
        - asset: assets/fonts/aeonik/AeonikTRIAL-Light.otf
          weight: 300
        - asset: assets/fonts/aeonik/AeonikTRIAL-LightItalic.otf
          style: italic
          weight: 300
        - asset: assets/fonts/aeonik/AeonikTRIAL-Regular.otf
          weight: 400
        - asset: assets/fonts/aeonik/AeonikTRIAL-RegularItalic.otf
          style: italic
          weight: 400
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/poppins/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
          weight: 800
